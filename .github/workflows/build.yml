name: Build article PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  article:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.17.0"

      - name: Check required fonts
        run: |
          mkdir -p .ci-fontcheck
          cat > .ci-fontcheck/fontcheck.tex <<'EOF'
          \documentclass{article}
          \usepackage{fontspec}
          \IfFontExistsTF{Times New Roman}{}{\PackageError{fontcheck}{Times New Roman is not installed}{}}
          \IfFontExistsTF{Courier New}{}{\PackageError{fontcheck}{Courier New is not installed}{}}
          \begin{document}
          Font check.
          \end{document}
          EOF
          tectonic -o .ci-fontcheck .ci-fontcheck/fontcheck.tex

      - name: Build article
        run: |
          mkdir -p build
          tectonic -o build article.tex

      - name: Upload article PDF
        uses: actions/upload-artifact@v7
        with:
          name: article-pdf
          path: build/article.pdf
          if-no-files-found: error
